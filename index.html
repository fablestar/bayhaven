<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#150f3d" />
  <title>Port Solena — day 1</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23150f3d'/><circle cx='8' cy='9' r='5' fill='%23ff5fa2'/></svg>" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #150f3d; }
    body { font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; color: #fff;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
    canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 6px rgba(20, 5, 40, .7); }
    #title { top: calc(10px + env(safe-area-inset-top)); left: calc(14px + env(safe-area-inset-left)); }
    #title b { display: block; font-size: 22px; letter-spacing: 3px; font-style: italic;
      color: #fff; text-shadow: 0 0 10px #ff4fa8, 0 0 22px #ff4fa8; }
    #title span { font-size: 11px; letter-spacing: 2px; opacity: .8; }
    #clock { top: calc(12px + env(safe-area-inset-top)); right: calc(14px + env(safe-area-inset-right));
      font-size: 18px; letter-spacing: 2px; pointer-events: auto; cursor: pointer; padding: 4px 6px; }
    #speed { bottom: calc(14px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
      font-size: 30px; font-style: italic; font-weight: bold; text-align: center; }
    #speed small { font-size: 11px; letter-spacing: 2px; margin-left: 4px; opacity: .8; }
    #hint { bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 13px; letter-spacing: 1px;
      background: rgba(21, 15, 61, .55); padding: 8px 14px; border-radius: 20px; white-space: nowrap;
      transition: opacity .8s; }
    #touch { display: none; }
    .pad { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); display: flex; gap: 12px; }
    .pad.left { left: calc(16px + env(safe-area-inset-left)); }
    .pad.right { right: calc(16px + env(safe-area-inset-right)); }
    .btn { width: 72px; height: 72px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .55);
      background: rgba(21, 15, 61, .35); color: #fff; font-size: 26px; display: flex;
      align-items: center; justify-content: center; touch-action: none; }
    .btn.on { background: rgba(255, 79, 168, .6); border-color: #fff; }
    .btn.small { font-size: 12px; letter-spacing: 1px; font-weight: bold; }
    @media (pointer: coarse) {
      #touch { display: block; }
      #hint { bottom: 110px; }
      #speed { bottom: auto; top: calc(40px + env(safe-area-inset-top)); left: auto;
        right: calc(14px + env(safe-area-inset-right)); transform: none; font-size: 24px; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="title" class="hud"><b>PORT SOLENA</b><span>DAY 1 BUILD · FABLESTAR GAMES</span></div>
  <div id="clock" class="hud" title="tap to skip time">14:00</div>
  <div id="speed" class="hud"><span id="kmh">0</span><small>KM/H</small></div>
  <div id="hint" class="hud">WASD / arrows to drive · T skips time · R resets · M mutes</div>
  <div id="touch">
    <div class="pad left">
      <div class="btn" data-key="left">◀</div>
      <div class="btn" data-key="right">▶</div>
    </div>
    <div class="pad right">
      <div class="btn small" data-key="brake">BRAKE</div>
      <div class="btn small" data-key="gas">GAS</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
